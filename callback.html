<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization - Texting English</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.7;color:#1f2933}
  textarea{width:100%;height:110px;font-family:monospace;font-size:13px;padding:10px;box-sizing:border-box}
  button{padding:10px 18px;font-size:15px;border:0;border-radius:8px;background:#d63a67;color:#fff;cursor:pointer}
  .err{color:#b42318}
</style>
</head>
<body>
<h2>Authorization code</h2>
<p id="msg">Loading…</p>
<textarea id="code" readonly style="display:none"></textarea>
<p><button id="copy" style="display:none">Copy code</button></p>
<p style="color:#6b7785;font-size:14px">이 코드를 관리 사이트의 "TikTok 인증 코드" 칸에 붙여넣으세요. 코드는 한 번만 쓸 수 있고 다른 사람과 공유하면 안 됩니다.<br>Paste this code into the dashboard. Do not share it.</p>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), err = q.get('error_description') || q.get('error');
  var msg = document.getElementById('msg'), box = document.getElementById('code'), btn = document.getElementById('copy');
  if (code) {
    msg.textContent = 'Authorization succeeded. Copy the code below.';
    box.value = code; box.style.display = 'block'; btn.style.display = 'inline-block';
    btn.onclick = function () { box.select(); document.execCommand('copy'); btn.textContent = 'Copied!'; };
  } else {
    msg.className = 'err';
    msg.textContent = err ? ('Authorization failed: ' + err) : 'No authorization code found in this URL.';
  }
</script>
</body>
</html>
